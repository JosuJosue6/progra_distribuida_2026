services:
  dbserver:
    image: postgres:18.1-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: books_db
    volumes:
      - "d:/josue/Desktop/Josu/Distribuida/db-distribuida:/var/lib/postgresql"
    ports:
      - 54321:5432
  consul:
    image: consul:1.15.4
    command: |
      agent -dev
      -ui
      -bind 0.0.0.0
      -client 0.0.0.0
    expose:
      - 8500
    ports:
      - 8500:8500

  proxy:
    image: traefik:3.6.6
    command: |
      --api.insecure=true
      --api.dashboard=true
      --entryPoints.http.address=":80"
      --providers.consulcatalog
      --providers.consulcatalog.refreshinterval=5s
      --providers.consulcatalog.exposedByDefault=false
      --providers.consulcatalog.endpoint.address=consul:8500
      --entryPoints.metrics.address=":8082"
      --entryPoints.http.address=":80"
      --metrics.prometheus=true
      --metrics.prometheus.entryPoint=metrics

    ports:
      - 8888:8080
      - 8080:80
    depends_on:
      - consul

  authors:
    image: josujosue/app-authors
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/books_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_PORT: 8080
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    expose:
      - 8080
    ports:
        - 8889:8080
    deploy:
      replicas: 1
    depends_on:
      - dbserver

  books:
    image: josujosue/app-books
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/books_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_PORT: 8080
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    expose:
      - 8080
    #    ports:
    #      - 8889:8080
    deploy:
      replicas: 1
    depends_on:
      - dbserver
      - authors
      -
  customers:
    image: josujosue/app-customers
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dbserver:5432/books_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8080
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    expose:
      - 8080
    #    ports:
    #      - 8889:8080
    deploy:
      replicas: 1
    depends_on:
      - dbserver
      - authors
      -
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./configs:/etc/prometheus
    ports:
      - 9090:9090
    expose:
      - 9090

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - 3000:3000
    expose:
      - 3000
